<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kişisel Finans Kokpiti</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2852/2852077.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding-bottom: 90px; -webkit-tap-highlight-color: transparent; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 480px; min-height: 100vh; position: relative; background-color: #0f172a; box-shadow: 0 0 20px rgba(0,0,0,0.5); overflow-x: hidden; }
        .bottom-nav { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(15px); border-top: 1px solid #334155; padding-bottom: env(safe-area-inset-bottom); position: fixed; bottom: 0; width: 100%; max-width: 480px; z-index: 50; }
        .glass-panel { background: #1e293b; border: 1px solid #334155; border-radius: 0.8rem; }
        .fab { background: linear-gradient(135deg, #10b981 0%, #059669 100%); box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4); }
        .nav-item { flex: 1; text-align: center; color: #64748b; transition: all 0.2s ease; font-size: 0.65rem; font-weight: 500; }
        .nav-item.active { color: #10b981; }
        .nav-icon { font-size: 1.1rem; margin-bottom: 0.15rem; display: block; }
        .mic-btn { background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%); box-shadow: 0 4px 10px rgba(139, 92, 246, 0.4); }
        .toast { position: absolute; top: 15px; left: 50%; transform: translateX(-50%) translateY(-100%); background: #10b981; color: white; padding: 8px 16px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; opacity: 0; transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55); z-index: 1000; white-space: nowrap; }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .spin-anim { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 0.5rem; padding: 10px; width: 100%; font-size: 0.85rem; outline: none; margin-bottom: 12px; }
        input[type="text"], select { background: #0f172a; border: 1px solid #334155; color: white; border-radius: 0.5rem; padding: 10px; width: 100%; font-size: 0.85rem; outline: none; margin-bottom: 12px; }
        input:focus, select:focus { border-color: #10b981; }
        label { font-size: 0.7rem; color: #94a3b8; margin-bottom: 4px; display: block; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
        
        .premium-card { position: relative; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); }
        .premium-card::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at top right, rgba(255,255,255,0.15) 0%, transparent 60%); pointer-events: none; }
        
        .radio-btn-fatura input:checked + div { background: #ef4444; color: white; border-color: #ef4444; }
        .radio-btn-abone input:checked + div { background: #3b82f6; color: white; border-color: #3b82f6; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="toast" class="toast"><i class="fa-solid fa-check mr-1"></i> <span id="toastMsg">İşlem başarılı</span></div>

    <!-- Üst Bar: AKTİF TARİH MOTORU (Tam Merkezlendi) -->
    <div class="sticky top-0 z-40 bg-slate-900/95 backdrop-blur-md border-b border-slate-800 px-3 py-2 flex justify-between items-center relative h-[48px]">
        <div class="flex items-center gap-2 relative z-10">
            <button onclick="syncToDrive()" class="w-8 h-8 rounded-full bg-slate-800 text-emerald-400 flex items-center justify-center transition-colors hover:bg-slate-700"><i class="fa-brands fa-google-drive text-sm"></i></button>
            <button onclick="openSearch()" class="w-8 h-8 rounded-full bg-slate-800 text-slate-300 flex items-center justify-center hover:text-white transition-colors hover:bg-slate-700"><i class="fa-solid fa-magnifying-glass text-xs"></i></button>
            <button onclick="togglePrivacy()" class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center transition-colors"><i id="eyeIcon" class="fa-solid fa-eye text-xs text-slate-300"></i></button>
        </div>
        
        <!-- Tam Merkezdeki Zaman Makinesi -->
        <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 flex items-center gap-2 bg-slate-800 rounded-full px-3 py-1 z-0">
            <button onclick="changeMonth(-1)" class="text-slate-400 hover:text-white transition-colors"><i class="fa-solid fa-chevron-left text-[10px]"></i></button>
            <span id="currentDateDisplay" class="font-bold text-[11px] tracking-wide text-white min-w-[90px] text-center">Yükleniyor...</span>
            <button onclick="changeMonth(1)" class="text-slate-400 hover:text-white transition-colors"><i class="fa-solid fa-chevron-right text-[10px]"></i></button>
        </div>

        <button onclick="activateVoice()" class="mic-btn w-8 h-8 rounded-full text-white flex items-center justify-center relative z-10"><i class="fa-solid fa-microphone text-sm"></i></button>
    </div>

    <!-- Dinamik İçerik Alanı -->
    <div id="content-area" class="p-3"></div>

    <!-- Alt Bar -->
    <div class="bottom-nav flex justify-between items-center px-1">
        <button class="nav-item active" onclick="switchTab('giderler', this)"><i class="fa-solid fa-receipt nav-icon"></i>Hareketler</button>
        <button class="nav-item" onclick="switchTab('taksitler', this)"><i class="fa-solid fa-credit-card nav-icon"></i>Kart/Kredi</button>
        <div class="relative flex justify-center w-14"><button onclick="openMenuModal()" class="fab w-10 h-10 rounded-full flex items-center justify-center text-white text-lg transform -translate-y-3 border-2 border-slate-900"><i class="fa-solid fa-plus"></i></button></div>
        <button class="nav-item" onclick="switchTab('alacaklar', this)"><i class="fa-solid fa-users nav-icon"></i>Alacaklar</button>
        <button class="nav-item" onclick="switchTab('cuzdan', this)"><i class="fa-solid fa-vault nav-icon"></i>Cüzdan</button>
    </div>

    <!-- Hızlı Ekleme Menüsü -->
    <div id="menuModal" class="absolute inset-0 bg-slate-900/80 backdrop-blur-sm hidden z-50 flex items-end justify-center pb-20 opacity-0 transition-opacity duration-200" onclick="if(event.target === this) closeMenuModal()">
        <div class="glass-panel w-11/12 p-3 transform translate-y-10 transition-transform duration-200" id="menuModalContent">
            <div class="flex justify-between items-center mb-3"><h3 class="text-sm font-bold text-white">Yeni Kayıt Ekle</h3><button onclick="closeMenuModal()" class="text-slate-400"><i class="fa-solid fa-xmark text-sm"></i></button></div>
            <div class="grid grid-cols-2 gap-2 mb-2">
                <button onclick="openForm('gelir')" class="bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 p-2 rounded-lg text-left text-xs"><i class="fa-solid fa-arrow-down mb-1 text-sm"></i><br><span class="font-bold">Gelir Ekle</span></button>
                <button onclick="openForm('gider')" class="bg-rose-500/10 border border-rose-500/20 text-rose-400 p-2 rounded-lg text-left text-xs"><i class="fa-solid fa-arrow-up mb-1 text-sm"></i><br><span class="font-bold">Gider Ekle</span></button>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="openForm('varlik')" class="bg-amber-500/10 border border-amber-500/20 text-amber-400 p-2 rounded-lg text-center text-xs"><i class="fa-solid fa-coins mb-1 text-sm block"></i><span class="font-bold">Varlık</span></button>
                <button onclick="openForm('taksit')" class="bg-blue-500/10 border border-blue-500/20 text-blue-400 p-2 rounded-lg text-center text-xs"><i class="fa-solid fa-building-columns mb-1 text-sm block"></i><span class="font-bold">Kart/Kredi</span></button>
                <button onclick="openForm('alacak')" class="bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 p-2 rounded-lg text-center text-xs"><i class="fa-solid fa-handshake mb-1 text-sm block"></i><span class="font-bold">Alacak/Borç</span></button>
                <button onclick="openForm('abonelik')" class="bg-teal-500/10 border border-teal-500/20 text-teal-400 p-2 rounded-lg text-center text-xs"><i class="fa-solid fa-file-invoice mb-1 text-sm block"></i><span class="font-bold">Fatura/Abone</span></button>
            </div>
        </div>
    </div>

    <!-- Dinamik Form Modalı -->
    <div id="dynamicFormModal" class="absolute inset-0 bg-slate-900/95 backdrop-blur-md hidden z-[60] flex items-center justify-center p-4" onclick="if(event.target === this) closeForm()">
        <div class="glass-panel w-full p-4 max-h-[90vh] overflow-y-auto" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-2"><h3 class="text-sm font-bold text-white" id="formTitle">Form</h3><button onclick="closeForm()" class="text-slate-400 text-lg"><i class="fa-solid fa-xmark"></i></button></div>
            <input type="hidden" id="formType">
            <div id="dynamicFormBody"></div>
            <button onclick="saveFormData()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-lg text-xs mt-3 transition-colors">KAYDET</button>
        </div>
    </div>

    <!-- UYGULAMA İÇİ MODALLAR (Emin Misiniz & Prompt) -->
    <div id="confirmModal" class="absolute inset-0 bg-slate-900/90 backdrop-blur-sm hidden z-[70] flex items-center justify-center p-4" onclick="if(event.target === this) closeConfirm()">
        <div class="glass-panel w-full max-w-[300px] p-4 text-center" onclick="event.stopPropagation()">
            <i class="fa-solid fa-circle-question text-3xl text-emerald-400 mb-3"></i>
            <h3 id="confirmMsg" class="text-white font-bold text-sm mb-4">Emin misiniz?</h3>
            <div class="flex gap-2">
                <button onclick="closeConfirm()" class="flex-1 py-2 rounded-lg bg-slate-800 text-slate-300 text-xs font-bold border border-slate-700 hover:text-white"><i class="fa-solid fa-xmark mr-1"></i> İPTAL</button>
                <button id="confirmBtn" class="flex-1 py-2 rounded-lg bg-emerald-600 text-white text-xs font-bold hover:bg-emerald-500"><i class="fa-solid fa-check mr-1"></i> ONAYLA</button>
            </div>
        </div>
    </div>
    
    <div id="promptModal" class="absolute inset-0 bg-slate-900/90 backdrop-blur-sm hidden z-[70] flex items-center justify-center p-4" onclick="if(event.target === this) closePrompt()">
        <div class="glass-panel w-full max-w-[300px] p-4" onclick="event.stopPropagation()">
            <h3 id="promptMsg" class="text-white font-bold text-sm mb-3">Tutar Girin</h3>
            <input type="number" id="promptInput" class="!mb-4 !p-2 text-center text-lg font-bold text-emerald-400" inputmode="decimal">
            <div class="flex gap-2">
                <button onclick="closePrompt()" class="flex-1 py-2 rounded-lg bg-slate-800 text-slate-300 text-xs font-bold border border-slate-700 hover:text-white"><i class="fa-solid fa-xmark mr-1"></i> İPTAL</button>
                <button id="promptBtn" class="flex-1 py-2 rounded-lg bg-emerald-600 text-white text-xs font-bold hover:bg-emerald-500"><i class="fa-solid fa-check mr-1"></i> KAYDET</button>
            </div>
        </div>
    </div>

    <!-- Analiz & Arama Modalı -->
    <div id="analizModal" class="absolute inset-0 bg-slate-900/95 backdrop-blur-md hidden z-[60] flex items-center justify-center p-4">
        <div class="glass-panel w-full p-4"><div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-2"><h3 class="text-sm font-bold text-white"><i class="fa-solid fa-chart-pie text-indigo-400 mr-2"></i>Harcama Analizi</h3><button onclick="document.getElementById('analizModal').classList.add('hidden')" class="text-slate-400 text-lg"><i class="fa-solid fa-xmark"></i></button></div><div id="analizContent"></div></div>
    </div>
    <div id="searchModal" class="absolute inset-0 bg-slate-900/95 backdrop-blur-md hidden z-[60] flex flex-col p-4">
        <div class="flex gap-2 mb-4"><input type="text" id="searchInput" onkeyup="performSearch()" placeholder="İşlem ara..." class="flex-1 !mb-0" autofocus><button onclick="closeSearch()" class="bg-slate-800 px-4 rounded-lg text-slate-300 font-bold text-xs">İPTAL</button></div>
        <div id="searchResults" class="overflow-y-auto flex-1 space-y-1.5"></div>
    </div>
</div>

<script>
    // --- GÖRECELİ TARİH & AKTİF ZAMAN MOTORU ---
    let aktifTarih = new Date();
    
    function updateDateDisplay() {
        const aylar = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];
        let gun = aktifTarih.getDate().toString().padStart(2, '0');
        let ay = aylar[aktifTarih.getMonth()];
        let yil = aktifTarih.getFullYear();
        let displayEl = document.getElementById('currentDateDisplay');
        if(displayEl) displayEl.innerText = `${gun} ${ay} ${yil}`;
    }
    
    function changeMonth(delta) { 
        aktifTarih.setDate(aktifTarih.getDate() + delta);
        updateDateDisplay(); 
    }
    
    function getTodayStr() { return new Date().toISOString().split('T')[0]; }
    
    function formatTarih(dateStr) {
        if(!dateStr || !dateStr.includes('-')) return dateStr;
        let dIslem = new Date(dateStr); let dGecerli = new Date(aktifTarih);
        dIslem.setHours(0,0,0,0); dGecerli.setHours(0,0,0,0);
        let days = (dGecerli - dIslem) / (1000 * 60 * 60 * 24);
        
        if(days === 0) return 'Bugün';
        if(days === 1) return 'Dün';
        
        const aylar = ["Oca", "Şub", "Mar", "Nis", "May", "Haz", "Tem", "Ağu", "Eyl", "Eki", "Kas", "Ara"];
        return `${dIslem.getDate().toString().padStart(2, '0')} ${aylar[dIslem.getMonth()]} ${dIslem.getFullYear()}`;
    }
    
    updateDateDisplay();

    // --- GİZLİLİK MODU ---
    let isPrivate = localStorage.getItem('finans_gizlilik') === 'true';
    document.getElementById('eyeIcon').className = isPrivate ? 'fa-solid fa-eye-slash text-xs text-rose-400' : 'fa-solid fa-eye text-xs text-slate-300';
    function togglePrivacy() { isPrivate = !isPrivate; localStorage.setItem('finans_gizlilik', isPrivate); document.getElementById('eyeIcon').className = isPrivate ? 'fa-solid fa-eye-slash text-xs text-rose-400' : 'fa-solid fa-eye text-xs text-slate-300'; switchTab(currentTab); }
    function fNum(num, dec = 0) { if(isPrivate) return '***'; return num.toLocaleString('tr-TR', {maximumFractionDigits: dec}); }

    // --- UYGULAMA İÇİ MODALLAR ---
    let pendingConfirm = null;
    function showConfirm(msg, callback) { document.getElementById('confirmMsg').innerText = msg; pendingConfirm = callback; document.getElementById('confirmModal').classList.remove('hidden'); }
    function closeConfirm() { document.getElementById('confirmModal').classList.add('hidden'); pendingConfirm = null; }
    document.getElementById('confirmBtn').onclick = () => { if(pendingConfirm) pendingConfirm(); closeConfirm(); };

    let pendingPrompt = null;
    function showPrompt(msg, defaultVal, callback) {
        document.getElementById('promptMsg').innerText = msg; let inp = document.getElementById('promptInput'); inp.value = defaultVal || ''; pendingPrompt = callback;
        document.getElementById('promptModal').classList.remove('hidden'); setTimeout(() => inp.focus(), 100);
    }
    function closePrompt() { document.getElementById('promptModal').classList.add('hidden'); pendingPrompt = null; }
    document.getElementById('promptBtn').onclick = () => { let val = document.getElementById('promptInput').value; if(pendingPrompt) pendingPrompt(val); closePrompt(); };

    // --- VERİTABANI VE STATE (v15) ---
    let eskiDb = JSON.parse(localStorage.getItem('finans_veritabani_v14')) || JSON.parse(localStorage.getItem('finans_veritabani_v13'));
    let db = JSON.parse(localStorage.getItem('finans_veritabani_v15')) || eskiDb || { 
        hareketler: [], cuzdan: [], taksitler: [], alacaklar: [], abonelikler: [], hedefler: []
    };
    
    if(!db.sonTutarlar) { db.sonTutarlar = { gelir: {}, gider: {} }; }
    if(!db.hedefler) { db.hedefler = []; }
    
    function abonelikSifirlamaKontrolu() {
        let now = new Date(); let gun = now.getDate(); let ayYil = now.getFullYear() + "-" + (now.getMonth() + 1);
        let degisiklikVar = false;
        if(db.abonelikler) {
            db.abonelikler.forEach(ab => {
                if(ab.odemeAyi !== ayYil && gun >= ab.resetGun) {
                    ab.odenen = 0; degisiklikVar = true;
                }
            });
        }
        if(degisiklikVar) { localStorage.setItem('finans_veritabani_v15', JSON.stringify(db)); }
    }
    abonelikSifirlamaKontrolu();
    
    let altinkaynak = { has: 6563.00, ceyrek: 10553.00, gram22: 5986.00, usd: 50.158, eur: 56.064 };
    let countdown = 180; let currentTab = 'giderler';

    const bankalar = [
        { id: 'akbank', ad: 'Akbank', icon: 'fa-building-columns', r1: '#be1238', r2: '#7a0b23' },
        { id: 'deniz', ad: 'DenizBank', icon: 'fa-ship', r1: '#0065b3', r2: '#003d6d' },
        { id: 'enpara', ad: 'Enpara', icon: 'fa-bolt', r1: '#a62681', r2: '#5f1549' },
        { id: 'garanti', ad: 'Garanti BBVA', icon: 'fa-leaf', r1: '#00973b', r2: '#005a23' },
        { id: 'halkbank', ad: 'Halkbank', icon: 'fa-h-square', r1: '#00a3e0', r2: '#00648a' },
        { id: 'isbankasi', ad: 'İş Bankası', icon: 'fa-building-columns', r1: '#004a99', r2: '#00254d' },
        { id: 'qnb', ad: 'QNB Finansbank', icon: 'fa-q', r1: '#261c6a', r2: '#120d33' },
        { id: 'teb', ad: 'TEB', icon: 'fa-building-columns', r1: '#009639', r2: '#005921' },
        { id: 'vakif', ad: 'VakıfBank', icon: 'fa-v', r1: '#f8b600', r2: '#b38200' },
        { id: 'yapi', ad: 'Yapı Kredi', icon: 'fa-y', r1: '#004c97', r2: '#002b55' },
        { id: 'ziraat', ad: 'Ziraat Bankası', icon: 'fa-z', r1: '#e1001a', r2: '#80000e' }
    ];

    const varlikTurleri = {
        'has': { ad: 'Has Altın (24K)', k: 'has', renk: 'amber' },
        'gram22': { ad: 'Gram Altın (22 Ayar)', k: 'gram22', renk: 'amber' },
        'ceyrek': { ad: 'Çeyrek Altın', k: 'ceyrek', renk: 'amber' },
        'usd': { ad: 'Dolar (USD)', k: 'usd', renk: 'emerald' },
        'eur': { ad: 'Euro (EUR)', k: 'eur', renk: 'blue' }
    };

    function saveData() { localStorage.setItem('finans_veritabani_v15', JSON.stringify(db)); switchTab(currentTab); }
    function showToast(msg, icon = 'fa-check') {
        const toast = document.getElementById('toast');
        document.getElementById('toastMsg').innerText = msg;
        toast.querySelector('i').className = `fa-solid ${icon} mr-1`;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
    }
    
    function syncToDrive() { showToast("Drive Yedeklemesi Başarılı", "fa-cloud-arrow-up"); }
    function deleteItem(kategori, id) {
        showConfirm("Silmek istediğinize emin misiniz?", () => { db[kategori] = db[kategori].filter(item => item.id !== id); saveData(); showToast("Silindi", "fa-trash"); });
    }

    setInterval(() => {
        countdown--;
        if (countdown <= 0) { fetchLiveRates(true); countdown = 180; } 
        let timerEl = document.getElementById('liveTimerDisplay');
        if(timerEl) timerEl.innerText = `${Math.floor(countdown / 60)}:${(countdown % 60).toString().padStart(2, '0')}`;
    }, 1000);

    async function fetchLiveRates(isAuto = false) {
        const btn = document.getElementById('refreshBtnIcon');
        if(btn) btn.classList.add('spin-anim');
        altinkaynak.has += (Math.random() * 2 - 1);
        altinkaynak.usd += (Math.random() * 0.04 - 0.02);
        altinkaynak.eur += (Math.random() * 0.04 - 0.02);
        setTimeout(() => { 
            if(btn) btn.classList.remove('spin-anim'); 
            if(currentTab === 'cuzdan') switchTab('cuzdan'); 
            if(!isAuto) showToast("Kurlar Güncellendi", "fa-rotate"); 
        }, 800);
    }
    function getAnlikFiyat(tur) { let v = varlikTurleri[tur]; if(!v) return 0; return altinkaynak[v.k] || 1; }

    function openSearch() {
        document.getElementById('searchModal').classList.remove('hidden');
        document.getElementById('searchInput').value = '';
        document.getElementById('searchResults').innerHTML = '<p class="text-center text-slate-500 text-xs mt-4">Aramaya başlayın...</p>';
    }
    function closeSearch() { document.getElementById('searchModal').classList.add('hidden'); }
    function performSearch() {
        let query = document.getElementById('searchInput').value.toLowerCase().trim();
        let res = document.getElementById('searchResults');
        if(query.length < 2) { res.innerHTML = ''; return; }
        let found = db.hareketler.filter(h => h.baslik.toLowerCase().includes(query));
        if(found.length === 0) { res.innerHTML = `<p class="text-center text-slate-500 text-xs mt-4">Kayıt bulunamadı.</p>`; return; }
        res.innerHTML = found.map(h => `
            <div class="glass-panel p-2 border-l-2 border-l-${h.tip === 'gelir' ? 'emerald' : 'rose'}-500 flex justify-between items-center mb-1.5">
                <div><h4 class="font-bold text-white text-[11px]">${h.baslik}</h4><p class="text-[8px] text-slate-400">${formatTarih(h.tarih)}</p></div>
                <div class="font-bold text-${h.tip === 'gelir' ? 'emerald' : 'rose'}-400 text-[11px]">${h.tip === 'gelir' ? '+' : '-'}${fNum(h.miktar)} ₺</div>
            </div>
        `).join('');
    }

    function openAnaliz() {
        let giderler = db.hareketler.filter(h => h.tip === 'gider');
        let totalGider = giderler.reduce((a,b) => a + b.miktar, 0);
        if(totalGider === 0) { showToast("Gider kaydı bulunmuyor", "fa-circle-info"); return; }
        
        let kat = { "Market & Gıda": 0, "Faturalar": 0, "Kredi & Kart": 0, "Ulaşım & Yakıt": 0, "Eğlence & Abonelik": 0, "Giyim & Kişisel": 0, "Diğer": 0 };
        giderler.forEach(h => {
            let b = h.baslik.toLowerCase();
            if(b.includes('market') || b.includes('gıda') || b.includes('migros') || b.includes('bim')) kat["Market & Gıda"] += h.miktar;
            else if(b.includes('fatura') || b.includes('elektrik') || b.includes('su') || b.includes('doğal gaz')) kat["Faturalar"] += h.miktar;
            else if(b.includes('kredi') || b.includes('kart') || b.includes('taksit')) kat["Kredi & Kart"] += h.miktar;
            else if(b.includes('eğlence') || b.includes('abonelik') || b.includes('netflix') || b.includes('oyun')) kat["Eğlence & Abonelik"] += h.miktar;
            else if(b.includes('ulaşım') || b.includes('yakıt') || b.includes('benzin') || b.includes('shell')) kat["Ulaşım & Yakıt"] += h.miktar;
            else if(b.includes('giyim') || b.includes('kişisel') || b.includes('kuaför')) kat["Giyim & Kişisel"] += h.miktar;
            else kat["Diğer"] += h.miktar;
        });
        
        let colors = { "Market & Gıda": "#10b981", "Faturalar": "#0ea5e9", "Kredi & Kart": "#f43f5e", "Ulaşım & Yakıt": "#f59e0b", "Eğlence & Abonelik": "#8b5cf6", "Giyim & Kişisel": "#ec4899", "Diğer": "#64748b" };
        let conicParts = []; let cA = 0;
        
        let legendHtml = Object.keys(kat).map(k => {
            if(kat[k] === 0) return '';
            let yuzde = (kat[k] / totalGider) * 100;
            conicParts.push(`${colors[k]} ${cA}% ${cA + yuzde}%`);
            cA += yuzde;
            return `
            <div class="flex justify-between items-center mb-1.5 text-[10px] text-white">
                <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full" style="background-color: ${colors[k]}"></span> ${k}</div>
                <div class="font-bold">${fNum(kat[k])} ₺ <span class="text-slate-400 font-normal">(%${yuzde.toFixed(1)})</span></div>
            </div>`;
        }).join('');
        
        document.getElementById('analizContent').innerHTML = `
            <div class="flex flex-col items-center mb-4">
                <div class="w-32 h-32 rounded-full relative mb-4" style="background: conic-gradient(${conicParts.join(', ')}); box-shadow: 0 0 20px rgba(0,0,0,0.3);">
                    <div class="absolute inset-0 m-auto w-20 h-20 bg-slate-900 rounded-full flex flex-col items-center justify-center border border-slate-700">
                        <span class="text-[8px] text-slate-400">TOPLAM GİDER</span>
                        <span class="text-[10px] font-bold text-white">${fNum(totalGider)} ₺</span>
                    </div>
                </div>
                <div class="w-full bg-slate-800/50 p-3 rounded-lg border border-slate-700">${legendHtml}</div>
            </div>`;
        document.getElementById('analizModal').classList.remove('hidden');
    }

    function saveFormData() {
        let tip = document.getElementById('formType').value;
        let id = Date.now();
        
        if (tip === 'gelir' || tip === 'gider') {
            let kategori = document.getElementById('f_kategori').value;
            let baslikEk = document.getElementById('f_baslik').value.trim();
            let tamBaslik = baslikEk ? `${kategori} - ${baslikEk}` : kategori;
            let tutar = parseFloat(document.getElementById('f_tutar').value);
            
            if(isNaN(tutar) || tutar <= 0) return showToast("Tutar giriniz!", "fa-exclamation");
            db.sonTutarlar[tip][kategori] = tutar;
            
            if (tip === 'gider') {
                let odemeId = document.getElementById('f_odeme').value;
                if(odemeId !== 'nakit') {
                    let kart = db.taksitler.find(t => t.id == odemeId);
                    if(kart) kart.borc += tutar;
                }
                db.hareketler.unshift({ id, tip: 'gider', baslik: tamBaslik, miktar: tutar, tarih: getTodayStr(), odemeYontemi: odemeId });
            } else {
                db.hareketler.unshift({ id, tip: 'gelir', baslik: tamBaslik, miktar: tutar, tarih: getTodayStr() });
            }
        }
        else if (tip === 'alacak') {
            let baslik = document.getElementById('f_baslik').value.trim();
            let alTip = document.getElementById('f_tur').value;
            let birim = document.getElementById('f_birim').value;
            let birimDiger = document.getElementById('f_birim_diger').value.trim();
            let tutar = parseFloat(document.getElementById('f_tutar').value);
            let odenen = parseFloat(document.getElementById('f_odenen').value) || 0;
            
            if(!baslik || isNaN(tutar)) return showToast("Eksik bilgi!", "fa-exclamation");
            if(birim === 'Diğer' && !birimDiger) return showToast("Birim türünü elle yazın!", "fa-exclamation");
            
            db.alacaklar.push({ id, tip: alTip, baslik, miktar: tutar, odenen, birim, birimDiger, sonIslemTutari: 0 });
        }
        else if (tip === 'varlik') {
            let tur = document.getElementById('f_tur').value;
            let adet = parseFloat(document.getElementById('f_adet').value);
            let maliyet = parseFloat(document.getElementById('f_maliyet').value);
            
            if(isNaN(adet) || isNaN(maliyet)) return showToast("Eksik bilgi!", "fa-exclamation");
            db.cuzdan.push({ id, tip: tur, miktar: adet, maliyet: maliyet });
        }
        else if (tip === 'taksit') {
            let kkTur = document.getElementById('f_kartkredi_tur').value;
            let banka = document.getElementById('f_banka').value;
            let baslik = document.getElementById('f_baslik').value.trim();
            
            if(!baslik) return showToast("Adı boş bırakma!", "fa-exclamation");
            
            if(kkTur === 'kart') {
                let limit = parseFloat(document.getElementById('f_limit').value);
                let borc = parseFloat(document.getElementById('f_borc').value) || 0;
                db.taksitler.push({ id, tur: 'kart', banka, baslik, limit, borc });
            } else {
                let toplam = parseFloat(document.getElementById('f_kredi_toplam').value);
                let taksit = parseFloat(document.getElementById('f_kredi_taksit').value);
                let odenen = parseFloat(document.getElementById('f_kredi_odenen').value) || 0;
                db.taksitler.push({ id, tur: 'kredi', banka, baslik, limit: toplam, borc: toplam - odenen, odenen, taksitS: taksit });
            }
        }
        else if (tip === 'abonelik') {
            let abTur = document.querySelector('input[name="f_ab_tur"]:checked').value;
            let baslik = document.getElementById('f_baslik').value.trim();
            let gunVal = parseInt(document.getElementById('f_gun').value);
            let gun = (!isNaN(gunVal) && gunVal >= 1 && gunVal <= 31) ? gunVal : 1;
            
            if(!baslik) return showToast("Adı giriniz!", "fa-exclamation");
            db.abonelikler.push({ id, baslik, resetGun: gun, odenen: 0, odemeAyi: '', tur: abTur });
        }
        else if (tip === 'hedef') {
            let baslik = document.getElementById('f_baslik').value.trim();
            let tutar = parseFloat(document.getElementById('f_tutar').value);
            
            if(!baslik || isNaN(tutar) || tutar <= 0) return showToast("Eksik bilgi!", "fa-exclamation");
            db.hedefler.push({ id, baslik, hedefFiyat: tutar });
        }
        
        closeForm();
        saveData();
        showToast("Kaydedildi!");
    }

    function editHareket(id) {
        let h = db.hareketler.find(x => x.id === id);
        if(h) {
            showPrompt("Yeni tutarı girin (TL):", h.miktar, (val) => {
                let yeni = parseFloat(val);
                if(!isNaN(yeni) && yeni > 0) {
                    h.miktar = yeni;
                    saveData();
                    showToast("Güncellendi!");
                }
            });
        }
    }

    // --- TEK TIKLA GERİ AL SİSTEMİ ---
    function undoAlacakIslem(id) {
        let a = db.alacaklar.find(x => x.id === id);
        if(a && a.sonIslemTutari && a.sonIslemTutari > 0) {
            let miktar = a.sonIslemTutari;
            a.odenen -= miktar;
            a.sonIslemTutari = 0; // Bir kere geri alınabilir
            
            if(a.birim === 'TL' || !a.birim) {
                let h_tip = a.tip === 'alacak' ? 'gider' : 'gelir';
                db.hareketler.unshift({ id: Date.now(), tip: h_tip, baslik: a.baslik + " (İşlem İptali)", miktar: miktar, tarih: getTodayStr(), odemeYontemi: 'nakit' });
            } else {
                let c_tip = 'tl';
                if(a.birim === 'Çeyrek Altın') c_tip = 'ceyrek';
                else if(a.birim === 'Has Altın') c_tip = 'has';
                else if(a.birim === 'Dolar') c_tip = 'usd';
                else if(a.birim === 'Euro') c_tip = 'eur';
                else if(a.birim === 'Diğer') c_tip = a.birimDiger;

                let c_kayit = db.cuzdan.find(c => c.tip === c_tip);
                let islemMiktari = a.tip === 'alacak' ? -miktar : miktar;
                
                if(c_kayit) {
                    c_kayit.miktar += islemMiktari;
                    if(c_kayit.miktar < 0) c_kayit.miktar = 0;
                }
            }
            saveData();
            showToast("Son İşlem Geri Alındı!");
        } else {
            showToast("Geri alınacak son işlem bulunamadı!", "fa-exclamation");
        }
    }

    function islemEkle(id, tur) {
        if(tur === 'alacak') {
            let inp = document.getElementById('alacak_input_' + id);
            let miktar = parseFloat(inp.value);
            
            if(!isNaN(miktar) && miktar > 0) {
                let kayit = db.alacaklar.find(x => x.id === id);
                if(kayit) { 
                    kayit.odenen += miktar;
                    kayit.sonIslemTutari = miktar;
                    
                    if(kayit.birim === 'TL' || !kayit.birim) {
                        let h_tip = kayit.tip === 'alacak' ? 'gelir' : 'gider';
                        db.hareketler.unshift({ id: Date.now(), tip: h_tip, baslik: kayit.baslik + (kayit.tip === 'alacak' ? ' Tahsilatı' : ' Borç Ödemesi'), miktar: miktar, tarih: getTodayStr(), odemeYontemi: 'nakit' });
                    } else {
                        let c_tip = 'tl';
                        if(kayit.birim === 'Çeyrek Altın') c_tip = 'ceyrek';
                        else if(kayit.birim === 'Has Altın') c_tip = 'has';
                        else if(kayit.birim === 'Dolar') c_tip = 'usd';
                        else if(kayit.birim === 'Euro') c_tip = 'eur';
                        else if(kayit.birim === 'Diğer') c_tip = kayit.birimDiger;

                        let c_kayit = db.cuzdan.find(c => c.tip === c_tip);
                        let islemMiktari = kayit.tip === 'alacak' ? miktar : -miktar;
                        
                        if(c_kayit) {
                            c_kayit.miktar += islemMiktari;
                            if(c_kayit.miktar < 0) c_kayit.miktar = 0;
                        } else {
                            let anlik = getAnlikFiyat(c_tip);
                            db.cuzdan.push({ id: Date.now(), tip: c_tip, miktar: islemMiktari, maliyet: anlik });
                        }
                    }
                    inp.value = '';
                    saveData();
                    showToast("İşlem Başarılı!"); 
                }
            }
        } else if(tur === 'kredi') {
            let k = db.taksitler.find(x => x.id === id);
            if(k) {
                let aylikTutar = k.limit / k.taksitS;
                showConfirm(`1 Taksit (${aylikTutar.toLocaleString('tr-TR', {maximumFractionDigits:0})} ₺) ödemek istiyor musunuz?`, () => {
                    k.odenen += aylikTutar;
                    k.borc -= aylikTutar;
                    db.hareketler.unshift({ id: Date.now(), tip: 'gider', baslik: k.baslik + ' Kredi Taksiti', miktar: aylikTutar, tarih: getTodayStr(), odemeYontemi: 'nakit' });
                    saveData();
                    showToast("Taksit Ödendi!");
                });
            }
        } else if(tur === 'kart') {
            let k = db.taksitler.find(x => x.id === id);
            if(k) {
                showPrompt("Karta kaç TL borç ödemesi yapıldı?", "", (val) => {
                    let miktar = parseFloat(val);
                    if(!isNaN(miktar) && miktar > 0) {
                        k.borc -= miktar;
                        if(k.borc < 0) k.borc = 0;
                        db.hareketler.unshift({ id: Date.now(), tip: 'gider', baslik: k.baslik + ' Kart Borcu Ödemesi', miktar: miktar, tarih: getTodayStr(), odemeYontemi: 'nakit' });
                        saveData();
                        showToast("Borç Ödendi!");
                    }
                });
            }
        }
    }

    function faturaOde(id) {
        let inp = document.getElementById('fatura_' + id);
        let odemeYontemi = document.getElementById('fatura_odeme_' + id).value;
        let miktar = parseFloat(inp.value);
        
        if (!isNaN(miktar) && miktar > 0) {
            let ab = db.abonelikler.find(x => x.id === id);
            if(ab) {
                ab.odenen = miktar;
                let now = new Date();
                ab.odemeAyi = now.getFullYear() + "-" + (now.getMonth() + 1);
                
                if(odemeYontemi !== 'nakit') {
                    let kart = db.taksitler.find(t => t.id == odemeYontemi);
                    if(kart) kart.borc += miktar;
                }
                
                let fisIsmi = ab.baslik + (ab.tur === 'abonelik' ? ' Aboneliği' : ' Faturası');
                db.hareketler.unshift({ id: Date.now(), tip: 'gider', baslik: fisIsmi, miktar: miktar, tarih: getTodayStr(), odemeYontemi: odemeYontemi });
                saveData();
                showToast("Ödendi!");
            }
        } else {
            showToast("Tutar giriniz!", "fa-exclamation");
        }
    }

    // --- SEKMELER (Tamamen Orijinal v15) ---
    function switchTab(tabId, element) {
        if(element) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
        }
        currentTab = tabId;
        const content = document.getElementById('content-area');
        
        if (tabId === 'giderler') {
            let totalGelir = db.hareketler.filter(x => x.tip === 'gelir').reduce((a,b) => a + b.miktar, 0);
            let totalGider = db.hareketler.filter(x => x.tip === 'gider').reduce((a,b) => a + b.miktar, 0);

                    </div>
                    <div class="flex justify-between text-[9px] bg-slate-900/50 p-1 rounded border border-slate-700/50">
                        <span class="text-slate-300">Top: ${fmt(a.miktar)}</span>
                        <span class="text-${isAlacak ? 'emerald' : 'rose'}-400">${isAlacak ? 'Alınan' : 'Ödenen'}: ${fmt(a.odenen)}</span>
                        <span class="text-white font-bold">Kalan: ${fmt(kalan)}</span>
                    </div>
                </div>`;
            };

            let aktifHtml = aktifAlacaklar.length === 0 ? `<p class="text-center text-slate-500 text-xs mt-4">Kayıt yok.</p>` : aktifAlacaklar.map(a => renderItem(a, false)).join('');
            let gecmisHtml = gecmisAlacaklar.length === 0 ? '' : `
                <div class="mt-4 border-t border-slate-800 pt-3">
                    <button onclick="document.getElementById('gecmisListesi').classList.toggle('hidden')" class="w-full py-2 bg-slate-800/80 text-slate-400 hover:text-white rounded-lg text-[10px] font-bold flex justify-between items-center px-3 border border-slate-700 transition-colors">
                        <span class="flex items-center gap-1.5"><i class="fa-solid fa-clock-rotate-left"></i> Tamamlananlar / Geçmiş</span> 
                        <i class="fa-solid fa-chevron-down"></i>
                    </button>
                    <div id="gecmisListesi" class="hidden mt-2 space-y-1.5 opacity-60 hover:opacity-100 transition-opacity">
                        ${gecmisAlacaklar.map(a => renderItem(a, true)).join('')}
                    </div>
                </div>
            `;
            content.innerHTML = `<h3 class="font-bold text-white text-xs mb-3 px-1">Veresiyeler & Alacaklar</h3>${aktifHtml}${gecmisHtml}`;
        }
    }
    switchTab('giderler');
</script>
</body>
</html>
